[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "seldon-sdk"
version = "0.1.0.dev1"
description = "Explicit Seldon Functions tooling and Python client"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.11,<3"]

[project.optional-dependencies]
login = ["keyring>=25,<26"]
local = ["seldon-runtime>=0.1.1.dev0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.8", "build>=1", "mypy>=1.15", "twine>=6"]

[project.scripts]
seldon = "seldon_sdk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seldon_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
